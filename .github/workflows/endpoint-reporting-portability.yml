name: Endpoint reporting portability
on:
  push:
    paths: ['**/endpointreport/**', '.github/workflows/endpoint-reporting-portability.yml']
  pull_request:
    paths: ['**/endpointreport/**', '.github/workflows/endpoint-reporting-portability.yml']
permissions:
  contents: read
jobs:
  collector-fixtures:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
      - run: go test ./internal/endpointreport
