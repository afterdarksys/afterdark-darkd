name: CI
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Core regression and race checks
        run: go test -race ./internal/... ./pkg/... ./cmd/afterdark-darkd ./cmd/afterdark-darkdadm ./cmd/darkapi
      - name: Build native commands
        run: go build -o dist/ ./cmd/afterdark-darkd ./cmd/afterdark-darkdadm ./cmd/darkapi
      - name: Native Endpoint Security compile gate
        if: runner.os == 'macOS'
        run: go build -tags esf -o dist/afterdark-darkd-es ./cmd/afterdark-darkd
      - name: Root plugin packages
        run: go test ./plugins/firewall-linux ./plugins/firewall-macos ./plugins/firewall-windows ./plugins/clamav
      - uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.os }}
          path: dist/
  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vet build-all
      - uses: actions/upload-artifact@v4
        with:
          name: portable-binaries
          path: dist/
  nested-modules:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test nested modules explicitly
        shell: bash
        run: |
          set -euo pipefail
          for module in plugins/osquery plugins/osx-security plugins/osx-security/auth plugins/osx-security/dsaudit plugins/osx-security/fsmonitor plugins/osx-security/keywatch plugins/osx-security/snapshot; do
            (cd "$module" && go test ./...)
          done
