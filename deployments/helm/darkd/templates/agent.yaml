apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-darkd
data:
  darkd.yaml: |
    daemon:
      mode: legacy
      data_dir: /var/lib/afterdark
      pid_file: /var/run/afterdark/darkd.pid
      plugin_dir: /var/lib/afterdark/plugins
    ipc:
      socket_path: /var/run/afterdark/darkd.sock
      auth_enabled: true
      auth_token_file: /var/lib/afterdark/.auth_token
    storage:
      backend: json
      path: /var/lib/afterdark/data
    api:
      darkapi:
        url: {{ .Values.darkapiURL | quote }}
        credential_file: /etc/afterdark/credentials/credentials.json
        telemetry_enabled: {{ .Values.telemetryEnabled }}
    services:
      patch_monitor:
        enabled: false
      threat_intel:
        enabled: false
      baseline_scanner:
        enabled: false
      network_monitor:
        enabled: false
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-darkd
spec:
  serviceName: {{ .Release.Name }}-darkd
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Release.Name }}-darkd
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-darkd
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: darkd
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: [afterdark-darkdadm, status, --json, --socket, /var/run/afterdark/darkd.sock, --token-file, /var/lib/afterdark/.auth_token]
            initialDelaySeconds: 10
            timeoutSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/afterdark}
            - {name: runtime, mountPath: /var/run/afterdark}
            - {name: logs, mountPath: /var/log/afterdark}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /etc/afterdark/darkd.yaml, subPath: darkd.yaml, readOnly: true}
            {{- if .Values.telemetryEnabled }}
            - {name: credentials, mountPath: /etc/afterdark/credentials, readOnly: true}
            {{- end }}
      volumes:
        - name: runtime
          emptyDir: {}
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ .Release.Name }}-darkd
        {{- if .Values.telemetryEnabled }}
        - name: credentials
          secret:
            secretName: {{ required "credentialsSecret is required for telemetry" .Values.credentialsSecret }}
            defaultMode: 0440
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-darkd
spec:
  clusterIP: None
  selector:
    app: {{ .Release.Name }}-darkd
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Release.Name }}-darkd
spec:
  podSelector:
    matchLabels:
      app: {{ .Release.Name }}-darkd
  policyTypes: [Ingress]
  ingress: []
